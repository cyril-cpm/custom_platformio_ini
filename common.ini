[common]
platform = espressif32
monitor_speed = 115200
lib_deps =
    cyril-musikaloid/Settingator@^0.3.27

[idf]
extends = common
framework = espidf
build_flags = -D ESPIDF=1

[env:STResp32c6SuperMini]
extends = idf
board = esp32-c6-devkitm-1
build_flags = ${idf.build_flags}
    -D STR_C6_SUPERMINI=1
    -D STR_BRIDGE_HID=1
    -D NET_HID_LED_PIN=GPIO_NUM_8
    -D BROADCAST_PIN=GPIO_NUM_19
    -D STR_RMT_MEM_BLOCK_SYMBOLS=48
    -D BRIDGE_ACTIVATION_PIN=GPIO_NUM_20

[env:STResp32c6SuperMiniNoLibDeps]
extends = env:STResp32c6SuperMini
lib_deps =

[env:STResp32wroom32]
extends = idf
board = esp32dev
build_flags = ${idf.build_flags}
    -D STR_WROOM_32=1
    -D STR_RMT_MEM_BLOCK_SYMBOLS=64

[env:STResp32wroom32NoLibDeps]
extends = env:STResp32wroom32
lib_deps =